packages:
  - packages/*
allowBuilds:
  esbuild: false
  sharp: true
overrides:
  nostr-tools: ^2.23.9
  tar: ^7.5.16
  minimatch: ^3.1.4
  uuid: ^11.1.1
  ws: ^8.21.0
  # Security floors for prod-shipped transitives (pnpm audit --prod clean).
  # Ranged, not blanket: a bare nanoid override would force v3 (CJS) consumers
  # onto ESM-only v5 and break dev tooling.
  'fast-uri@>=3.0.0 <3.1.6': '>=3.1.6'
  'nanoid@>=4.0.0 <5.1.16': '>=5.1.16'
  'devalue@<5.9.1': '>=5.9.2'
patchedDependencies:
  nostr-signer-capacitor-plugin@0.0.5: patches/nostr-signer-capacitor-plugin@0.0.5.patch
  applesauce-accounts@6.0.0: patches/applesauce-accounts@6.0.0.patch
  applesauce-signers@6.0.1: patches/applesauce-signers@6.0.1.patch
  bits-ui@2.18.1: patches/bits-ui@2.18.1.patch
  ts-mls@2.0.0-rc.13: patches/ts-mls@2.0.0-rc.13.patch
